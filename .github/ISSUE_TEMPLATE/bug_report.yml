name: Bug report
description: Report a reproducible error, crash, installation issue, or regression.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem in buddie. Search [existing issues](https://github.com/tsyyan/buddie/issues) before submitting.

        **Public reports only:** do not post tokens, private repositories, transcripts, source snapshots, or personal information. Use synthetic data and redact all logs. For a vulnerability, follow [SECURITY.md](https://github.com/tsyyan/buddie/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Verification (quotes / numbers)
        - Repository / GitHub (files / PR / CI)
        - Execution / run anchors
        - Environment diagnostics / grants
        - Hooks / policy / profiles
        - MCP / CLI / integrations
        - Feedback / receipts / freshness
        - Installation / packaging / update
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Buddie version or commit
      description: Output of `buddie --version` or the commit SHA, if available.
      placeholder: "2.0.8 / main @ <commit> / unknown"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Client, installation method, OS, and Python version
      placeholder: "Claude Code plugin; marketplace; Windows 11; Python 3.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example and the smallest relevant configuration (redacted).
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error or a small sanitized receipt excerpt, if available.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Intermittent
        - Once
        - Not sure
  - type: textarea
    id: additional
    attributes:
      label: Additional context (optional)
      description: Logs, relevant configuration, related issues, or workaround. Only public, redacted material.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I have removed secrets, private content, and personal information from this public issue.
          required: true
