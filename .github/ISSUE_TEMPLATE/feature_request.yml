name: Feature request
description: Propose a capability or improvement with an observable outcome.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please describe **the problem before the proposed implementation**. Check [existing requests](https://github.com/tsyyan/buddie/issues) first. Keep examples synthetic and do not share confidential material.
  - type: dropdown
    id: area
    attributes:
      label: Area of improvement
      options:
        - Claim discovery / verification coverage
        - Sources / semantic evidence support
        - GitHub / execution evidence
        - Environment diagnostics
        - Receipts / provenance / attestations
        - Feedback / repair / user experience
        - Integrations (Claude / Codex / other clients)
        - Performance / cost / installation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What task are you trying to complete, and what is currently difficult or missing?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance example
      description: What observable result would make the feature useful?
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach (optional)
      description: An implementation idea is welcome, but not necessary.
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround and alternatives (optional)
      description: Workarounds attempted, interoperability requirements, and trade-offs.
  - type: dropdown
    id: impact
    attributes:
      label: How much does this affect your workflow?
      options:
        - Blocks an important use case
        - Frequent inconvenience
        - Occasional improvement
        - Exploratory idea
