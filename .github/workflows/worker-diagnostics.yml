name: worker-diagnostics
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/worker-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Repeat original mid-match lifecycle with syscall diagnostics
        run: |
          python -u - <<'PY'
          import os, sys
          from pathlib import Path
          source = Path('tests/test_patterns_worker.py').read_text()
          injection = '''
          import subprocess
          real_popen = subprocess.Popen
          def diagnostic_popen(*a, **k):
              k['stderr'] = sys.stderr
              return real_popen(*a, **k)
          subprocess.Popen = diagnostic_popen
          patterns.WORKER = patterns.WORKER.replace(
              'ctypes.CDLL(None).prctl(1, 9)',
              "rc = ctypes.CDLL(None, use_errno=True).prctl(1, 9); "
              "sig = ctypes.c_int(); ctypes.CDLL(None).prctl(2, ctypes.byref(sig)); "
              "print('PDEATHSIG', rc, ctypes.get_errno(), sig.value, file=sys.stderr, flush=True)")
          '''
          source = source.replace('patterns.CALL = 600', injection + '\npatterns.CALL = 600')
          source = source.replace('    assert ended\n',
              '    assert ended, Path(f"/proc/{worker}/status").read_text()\n')
          scope = {'__file__': str(Path('tests/test_patterns_worker.py').resolve())}
          exec(compile(source, scope['__file__'], 'exec'), scope)
          print(sys.version, flush=True)
          for i in range(50):
              print('ITERATION', i, flush=True)
              scope['test_the_worker_ends_with_buddies_process_mid_match']()
          PY
