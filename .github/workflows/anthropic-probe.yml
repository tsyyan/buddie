# What the repository's ANTHROPIC_API_KEY gives (experiments/anthropic_probe.py), and whether buddie's released plugin
# works in headless Claude Code with it: the same paragraph with one altered quote, without and with the plugin.
# No permissions are skipped: the only tool allowed is WebFetch on raw.githubusercontent.com (the quoted
# file); buddie's hook needs none. Results are the run's annotations. Runs on a push to experiment/anthropic-probe. Costs cents.
name: anthropic-probe
on:
  push:
    branches: [experiment/anthropic-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: https://api.tokenn.pro/anthropic  # the key's gateway (owner, 2026-10-31); Claude Code reads it too
      MODEL: claude-opus-5  # what the gateway lists (no claude-opus-5-5)
      CLAUDE_CLI: "@anthropic-ai/claude-code@2.1.310"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: api
        run: python experiments/anthropic_probe.py --model "$MODEL" --notices
      - name: claude code without and with buddie
        if: always()
        run: |
          # LICENSE of the release tag: "Version 2.0, January 2004"; the paragraph quotes it as 2005
          url=https://raw.githubusercontent.com/tsyyan/buddie/v2.0.7/LICENSE
          para="The project is licensed under the Apache License, “Version 2.0, January 2005” ([license]($url))."
          ask="Return this paragraph to the reader as your final answer, unchanged, and nothing else: $para"
          for mode in without with; do
            export HOME="$RUNNER_TEMP/home-$mode"; mkdir -p "$HOME" "$RUNNER_TEMP/work-$mode"
            cd "$RUNNER_TEMP/work-$mode"
            if [ "$mode" = with ]; then
              npx --yes "$CLAUDE_CLI" plugin marketplace add tsyyan/buddie >/dev/null
              npx --yes "$CLAUDE_CLI" plugin install buddie@buddie >/dev/null
              echo "::notice title=claude code plugin::$(npx --yes "$CLAUDE_CLI" plugin list 2>&1 | tr '\n' ' ' | cut -c1-300)"
            fi
            npx --yes "$CLAUDE_CLI" -p "$ask" --model "$MODEL" --output-format json --max-turns 8 \
              --allowedTools "WebFetch(domain:raw.githubusercontent.com)" > out.json 2> err.txt || true
            python3 - "$mode" <<'EOF'
          import json, sys
          mode = sys.argv[1]
          try:
              r = json.load(open("out.json"))
          except Exception:
              print(f"::notice title=claude code {mode} buddie::no JSON; stderr: {open('err.txt').read()[:300]!r}")
              sys.exit(0)
          final = (r.get("result") or "").replace("\n", " ")
          verdict = "kept the false quote" if "January 2005" in final else (
              "fixed it" if "January 2004" in final else "removed or changed it")
          print(f"::notice title=claude code {mode} buddie::{verdict}; turns {r.get('num_turns')}, "
                f"cost ${r.get('total_cost_usd')}, usage {json.dumps(r.get('usage'))[:300]}; final: {final[:300]}")
          EOF
          done
