name: bdx002-model-free
on:
  pull_request:
    paths:
      - 'experiments/BDX-002-github-evidence/**'
      - '.github/workflows/bdx002-model-free.yml'
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s experiments/BDX-002-github-evidence/tests -v
