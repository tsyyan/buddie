name: bdx-model-free
on:
  pull_request:
    paths:
      - 'experiments/BDX-001-lite/**'
      - '.github/workflows/bdx-model-free.yml'
permissions:
  contents: read
jobs:
  stored-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q experiments/BDX-001-lite/harness/tests
      - run: python experiments/BDX-001-lite/evaluation/audit_smoke.py
      - run: python experiments/BDX-001-lite/evaluation/privacy_scan.py
