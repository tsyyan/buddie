# Manual, focused Linux reproduction for worker-lifecycle diagnostics.
# This workflow is supplemental. It never replaces the required ci.yml gate.
name: worker-linux-diagnostic

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Focused test repetitions (1-10; default 3)'
        required: true
        default: '3'
        type: choice
        options: ['1', '3', '5', '10']
      python:
        description: 'Python version'
        required: true
        default: '3.13'
        type: choice
        options: ['3.11', '3.12', '3.13']

permissions:
  contents: read

concurrency:
  group: worker-linux-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python }}
      - run: python -m pip install -e . pytest
      - name: Focused worker lifecycle reproduction
        shell: bash
        env:
          REPEATS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          case "$REPEATS" in 1|3|5|10) ;; *) echo "::error::invalid repetition budget"; exit 2 ;; esac
          echo "SHA: $GITHUB_SHA"
          echo "Python: ${{ inputs.python }}"
          for i in $(seq 1 "$REPEATS"); do
            echo "::group::worker lifecycle repetition $i/$REPEATS"
            python -m pytest -q -s tests/test_patterns_worker.py::test_the_worker_ends_with_buddies_process_mid_match
            echo "::endgroup::"
          done
          echo "Focused run complete; full PR CI gate remains mandatory."
