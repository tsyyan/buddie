# Manual, focused Linux reproduction for worker-lifecycle diagnostics.
# This workflow is supplemental. It never replaces the required ci.yml gate.
name: worker-linux-diagnostic

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Focused test repetitions (1-10; default 3)'
        required: true
        default: '3'
        type: choice
        options: ['1', '3', '5', '10']
      python:
        description: 'Python version'
        required: true
        default: '3.13'
        type: choice
        options: ['3.11', '3.12', '3.13']

permissions:
  contents: read

concurrency:
  group: worker-linux-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate dispatch inputs before setup
        shell: bash
        env:
          REPEATS: ${{ inputs.repetitions }}
          PYTHON_VERSION: ${{ inputs.python }}
        run: |
          set -euo pipefail
          case "$REPEATS" in 1|3|5|10) ;; *) exit 2 ;; esac
          case "$PYTHON_VERSION" in 3.11|3.12|3.13) ;; *) exit 2 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python }}
      - run: python -m pip install -e . pytest
      - name: Focused worker lifecycle reproduction
        shell: bash
        env:
          REPEATS: ${{ inputs.repetitions }}
          PYTHON_VERSION: ${{ inputs.python }}
        run: |
          set -euo pipefail
          case "$REPEATS" in 1|3|5|10) ;; *) echo "::error::invalid repetition budget"; exit 2 ;; esac
          echo "SHA: $GITHUB_SHA"
          echo "Python: $PYTHON_VERSION"
          mkdir -p diagnostic-evidence
          { uname -a; python -VV; cat /proc/1/cgroup; cat /proc/self/cgroup; } > diagnostic-evidence/environment.txt
          # Observation only: do not wrap/patch the worker or change the safety assertion.
          # Samples can miss transitions shorter than 100ms; absence is not proof of no event.
          (
            while true; do
              date -u +%Y-%m-%dT%H:%M:%S.%NZ
              ps -eo pid,ppid,state,etimes,comm
              sleep 0.1
            done
          ) > diagnostic-evidence/processes.txt &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true; wait "$observer" 2>/dev/null || true' EXIT
          for i in $(seq 1 "$REPEATS"); do
            echo "::group::worker lifecycle repetition $i/$REPEATS"
            timeout 90s python -m pytest -q -s tests/test_patterns_worker.py::test_the_worker_ends_with_buddies_process_mid_match 2>&1 | tee "diagnostic-evidence/repetition-$i.txt"
            echo "::endgroup::"
          done
          echo "Focused run complete; full PR CI gate remains mandatory."
      - name: Retain evidence including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          retention-days: 7
          if-no-files-found: warn
