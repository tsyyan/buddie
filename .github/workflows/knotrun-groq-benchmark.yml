name: knotrun-groq-benchmark
on:
  push:
    branches: [experiment/groq-knotrun-bench]
    paths:
      - 'experiments/knotrun_groq_bench.py'
      - '.github/workflows/knotrun-groq-benchmark.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare strategies on GPT-OSS-120B
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p benchmark-output
          python experiments/knotrun_groq_bench.py --seed 37 --output benchmark-output/groq_seed37.json > benchmark-output/benchmark.log 2>&1
          python - <<'PY'
          import json
          report=json.load(open("benchmark-output/groq_seed37.json"))
          for name,row in report["summary"].items():
              print(f"{name}: {row['success']}/{row['total']} | calls {row['calls']} | tokens {row['tokens']} | inference_s {row['inference_s']}")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Groq GPT-OSS-120B — AEF-005 benchmark\n\n")
              out.write("| Mode | Success | Calls | Tokens | Inference seconds |\n|---|---:|---:|---:|---:|\n")
              for name,row in report["summary"].items():
                  out.write(f"| {name} | {row['success']}/{row['total']} | {row['calls']} | {row['tokens']} | {row['inference_s']} |\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: knotrun-groq-aef005-${{ github.run_id }}
          path: |
            benchmark-output/groq_seed37.json
            benchmark-output/benchmark.log
          if-no-files-found: warn
