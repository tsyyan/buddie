# One tool-calling request to each free endpoint of experiments/endpoint_pool.py, with the repository's keys, so a
# new key or provider is checked before a run uses it. Results are the run's annotations. Runs on a push to
# experiment/endpoint-probe.
name: endpoint-probe
on:
  push:
    branches: [experiment/endpoint-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_GATEWAY_API_KEY: ${{ secrets.VERSELAI_API_KEY }}
          FASTROUTER_API_KEY: ${{ secrets.FASTROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          cd experiments
          python probe_endpoints.py --notices ovh groq cloudflare vercel-baseten vercel-groq vercel-cerebras \
            fastrouter sambanova cerebras
