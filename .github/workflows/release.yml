# Release in two runs of this workflow (docs/release.md). Nothing is published by a push.
#
# 1. Candidate. Pushing the tag vX.Y.Z (equal to buddie.__version__), or running this workflow by hand with no
#    `candidate`, builds and validates the release candidate (release-candidate.yml): sdist, wheel and the Claude
#    Desktop bundle from that exact commit, with release-manifest.json and SHA256SUMS. It publishes nothing.
# 2. Publish. Run this workflow by hand on the tag, with `candidate` = the run id of step 1 and `confirm` =
#    "publish buddie X.Y.Z". `authorize` checks the tag, the version, that the commit is on main, and that the
#    candidate run is this workflow's, succeeded and built this same commit; then each stage publishes the candidate's
#    files as they were recorded (SHA-256 checked before and after), never a rebuild: PyPI by trusted publishing (the
#    `pypi` environment, no token stored), the MCP Registry (GitHub OIDC), the GitHub Release. Every stage can be run
#    again, alone (`only`), and skips what is already published identically.
# 3. plugin-stable (separately, never part of `all`). Run by hand on the tag with the same `candidate`, `only` =
#    plugin-stable and `confirm` = "promote buddie X.Y.Z to plugin-stable": after the same authorization, the
#    candidate's verified compact plugin becomes the next commit of the distribution branch plugin-stable
#    (scripts/plugin_promote.py): never forced, idempotent, refused on any unexpected branch state; then the branch is
#    checked file by file, installed into an isolated Claude Code configuration and run. Its first promotion also
#    needs `create_branch`. Nothing else, including the default branch and the tags, is touched.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate:
        description: "publish: run id of a successful candidate run for this tag (empty: build a candidate only)"
        type: string
        default: ""
      confirm:
        description: "publish: type exactly: publish buddie X.Y.Z (plugin-stable: promote buddie X.Y.Z to plugin-stable)"
        type: string
        default: ""
      only:
        description: "publish: every stage, or one of them again"
        type: choice
        options: [all, pypi, mcp-registry, github-release, plugin-stable]
        default: all
      create_branch:
        description: "plugin-stable: allow its first promotion to create the branch"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'push' || inputs.candidate == ''
    uses: ./.github/workflows/release-candidate.yml

  authorize:
    environment: pypi
    if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: the tag, the version, main, the confirmation, the candidate run and its files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          CONFIRM: ${{ inputs.confirm }}
          ONLY: ${{ inputs.only }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9]+$ ]] || { echo "::error::candidate must be a run id"; exit 1; }
          v=$(python3 -c "import buddie; print(buddie.__version__)")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE" > run.json
          tag_commit=$(git rev-parse --verify --quiet "refs/tags/$GITHUB_REF_NAME^{commit}" || echo none)
          on_main=no; git merge-base --is-ancestor "$GITHUB_SHA" origin/main && on_main=yes
          python3 scripts/release_publish.py authorize rc --run run.json --candidate "$CANDIDATE" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" \
            --tag-commit "$tag_commit" --on-main "$on_main" --version "$v" --confirm "$CONFIRM" --only "$ONLY"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  pypi:
    needs: authorize
    if: inputs.only == 'all' || inputs.only == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buddie/${{ needs.authorize.outputs.version }}/
    permissions:
      id-token: write
      actions: read
    env:
      V: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: the candidate's files, unchanged; what PyPI already holds for the version
        id: plan
        run: |
          python3 scripts/release_manifest.py verify rc --version "$V" --commit "$GITHUB_SHA"
          mkdir upload && cp rc/dist/* upload/   # the wheel and the sdist only, never the bundle
          code=$(curl -s -o pypi.json -w '%{http_code}' "https://pypi.org/pypi/buddie/$V/json")
          case "$code" in
            200) plan=$(python3 scripts/release_publish.py pypi-plan rc pypi.json) ;;   # stops on a foreign file
            404) plan=upload ;;
            *) echo "::error::PyPI answered $code"; exit 1 ;;
          esac
          echo "PyPI: $plan"; echo "plan=$plan" >> "$GITHUB_OUTPUT"
      # skip-existing: after a partial upload only the missing file is sent; the plan above already refused any file
      # PyPI holds that is not the candidate's, and the check below refuses one again
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        if: steps.plan.outputs.plan == 'upload'
        with:
          packages-dir: upload/
          skip-existing: true
      - name: PyPI serves exactly the candidate's files
        run: |
          for i in $(seq 20); do
            curl -fsS "https://pypi.org/pypi/buddie/$V/json" -o pypi.json \
              && python3 scripts/release_manifest.py pypi rc pypi.json && exit 0
            sleep 15
          done
          exit 1

  mcp-registry:
    # the registry lists io.github.tsyyan/buddie (server.json) for a version PyPI already has: it checks the package's
    # README for the mcp-name line. GitHub OIDC proves the namespace, no secret needed
    needs: [authorize, pypi]
    if: >-
      always() && needs.authorize.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
      && (inputs.only == 'all' || inputs.only == 'mcp-registry')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      V: ${{ needs.authorize.outputs.version }}
      PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      SERVER: https://registry.modelcontextprotocol.io/v0/servers/io.github.tsyyan%2Fbuddie/versions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: server.json is the version, and PyPI serves the candidate's files
        run: |
          sv=$(python3 -c "import json; d=json.load(open('server.json')); print(d['version'], d['packages'][0]['version'])")
          [ "$sv" = "$V $V" ] || { echo "::error::server.json is $sv"; exit 1; }
          curl -fsS "https://pypi.org/pypi/buddie/$V/json" -o pypi.json
          python3 scripts/release_manifest.py pypi rc pypi.json
      - name: publish, unless the registry already lists this version as this package
        run: |
          code=$(curl -s -o listed.json -w '%{http_code}' "$SERVER/$V")
          if [ "$code" = 200 ]; then
            python3 scripts/release_publish.py registry-check server.json listed.json
            echo "::notice::the registry already lists $V as server.json describes it"; exit 0
          fi
          [ "$code" = 404 ] || { echo "::error::the registry answered $code"; exit 1; }
          curl -fsSL "$PUBLISHER" -o publisher.tar.gz
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: the registry lists it as server.json describes it
        run: |
          for i in $(seq 10); do
            curl -fsS "$SERVER/$V" -o listed.json && python3 scripts/release_publish.py registry-check server.json \
              listed.json && exit 0
            sleep 10
          done
          exit 1

  github-release:
    # a draft first, the files uploaded and checked against the candidate, then published: a run that stops halfway
    # leaves a draft that the next run completes
    needs: [authorize, pypi]
    if: >-
      always() && needs.authorize.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
      && (inputs.only == 'all' || inputs.only == 'github-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.authorize.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: the candidate's files, unchanged, and on PyPI
        run: |
          python3 scripts/release_manifest.py verify rc --version "$V" --commit "$GITHUB_SHA"
          curl -fsS "https://pypi.org/pypi/buddie/$V/json" -o pypi.json
          python3 scripts/release_manifest.py pypi rc pypi.json
      - name: the release, with the changelog section and the candidate's files
        run: |
          awk -v v="$V" '$0 ~ "^## buddie " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "buddie $V" > notes.md
          python3 scripts/release_publish.py github-release rc --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" --version "$V" --notes notes.md

  plugin-stable:
    # the authorized candidate's compact plugin onto the distribution branch, only when chosen by hand; the commit,
    # its source commit and package SHA-256 go to the run summary. A plain push: a moved branch rejects it
    needs: authorize
    if: inputs.only == 'plugin-stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.authorize.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CLI: "@anthropic-ai/claude-code@2.1.310"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: the candidate's plugin, unchanged and rebuilt identically from the tag's commit
        run: |
          python3 scripts/release_manifest.py verify rc --version "$V" --commit "$GITHUB_SHA"
          python3 scripts/plugin_package.py verify rc/plugin --ref "$GITHUB_SHA"
      - name: promote, or find it already promoted
        env:
          CREATE: ${{ inputs.create_branch }}
        run: |
          flag=""; [ "$CREATE" = true ] && flag="--create"
          python3 scripts/plugin_promote.py promote rc --version "$V" --source "$GITHUB_SHA" $flag > promotion.json
          { echo "### plugin-stable"; echo; echo '```json'; cat promotion.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: the branch is exactly the package, and it installs and runs
        run: |
          commit=$(python3 -c "import json; print(json.load(open('promotion.json'))['commit'])")
          git fetch --quiet origin plugin-stable
          test "$(git rev-parse FETCH_HEAD)" = "$commit" || { echo "::error::plugin-stable is not $commit"; exit 1; }
          python3 scripts/plugin_promote.py verify --commit "$commit" --manifest rc/plugin/plugin-manifest.json
          mkdir "$RUNNER_TEMP/stable" && git archive "$commit" | tar -x -C "$RUNNER_TEMP/stable"
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          npx --yes "$CLAUDE_CLI" plugin validate --strict "$RUNNER_TEMP/stable"
          npx --yes "$CLAUDE_CLI" plugin marketplace add "$RUNNER_TEMP/stable"
          npx --yes "$CLAUDE_CLI" plugin install buddie@buddie
          installed=$(python3 -c "import json,os; d=json.load(open(os.path.join(os.environ['CLAUDE_CONFIG_DIR'], 'plugins', 'installed_plugins.json'))); print(d['plugins']['buddie@buddie'][0]['installPath'])")
          python3 scripts/smoke_plugin.py "$installed" --manifest rc/plugin/plugin-manifest.json
