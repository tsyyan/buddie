# Release: push a tag vX.Y.Z equal to buddie.__version__. Builds the sdist, the wheel and the Claude Desktop bundle,
# publishes to PyPI by trusted publishing (no token stored here) and attaches the files to a GitHub Release.
# Run it by hand with target=testpypi to try a build on TestPyPI first. One-time setup: docs/release.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "where to publish a manual run"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag is the code's version
        id: version
        run: |
          v=$(python -c "import buddie; print(buddie.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but buddie.__version__ is $v"; exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: the wheel installs and runs in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/buddie" --version
          "$RUNNER_TEMP/venv/bin/buddie-verbatim" --help > /dev/null
      - uses: actions/setup-node@v4
        if: hashFiles('manifest.json') != ''
        with:
          node-version: "22"
      - name: Claude Desktop bundle
        if: hashFiles('manifest.json') != ''
        run: |
          mkdir -p bundle
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . "bundle/buddie-${{ steps.version.outputs.version }}.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/
          if-no-files-found: ignore

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buddie/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/buddie/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    if: github.ref_type == 'tag'
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out/
      - name: release with the changelog section and the files
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## buddie " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "buddie $V" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "buddie $V" --notes-file notes.md \
            out/dist/* $(ls out/bundle/*.mcpb 2>/dev/null)
