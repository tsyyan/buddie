# Release in two runs of this workflow (docs/release.md). Nothing is published by a push.
#
# 1. Candidate. Pushing the tag vX.Y.Z (equal to buddie.__version__), or running this workflow by hand with no
#    `candidate`, builds and validates the release candidate (release-candidate.yml): sdist, wheel and the Claude
#    Desktop bundle from that exact commit, with release-manifest.json and SHA256SUMS. It publishes nothing.
# 2. Publish. Run this workflow by hand on the tag, with `candidate` = the run id of step 1 and `confirm` =
#    "publish buddie X.Y.Z". `authorize` checks the tag, the version, that the commit is on main, and that the
#    candidate run is this workflow's, succeeded and built this same commit; then each stage publishes the candidate's
#    files as they were recorded (SHA-256 checked before and after), never a rebuild: PyPI by trusted publishing (the
#    `pypi` environment, no token stored), the MCP Registry (GitHub OIDC), the GitHub Release. Every stage can be run
#    again, alone (`only`), and skips what is already published identically.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate:
        description: "publish: run id of a successful candidate run for this tag (empty: build a candidate only)"
        type: string
        default: ""
      confirm:
        description: "publish: type exactly: publish buddie X.Y.Z"
        type: string
        default: ""
      only:
        description: "publish: every stage, or one of them again"
        type: choice
        options: [all, pypi, mcp-registry, github-release]
        default: all

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'push' || inputs.candidate == ''
    uses: ./.github/workflows/release-candidate.yml

  authorize:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the tag, the version, main, the confirmation, the candidate run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF_TYPE" = tag ] || fail "publish runs on a release tag, not $GITHUB_REF"
          v=$(python3 -c "import buddie; print(buddie.__version__)")
          [ "$GITHUB_REF_NAME" = "v$v" ] || fail "tag $GITHUB_REF_NAME but buddie.__version__ is $v"
          [ "$CONFIRM" = "publish buddie $v" ] || fail "confirm must be exactly: publish buddie $v"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "$GITHUB_SHA is not on main"
          [[ "$CANDIDATE" =~ ^[0-9]+$ ]] || fail "candidate must be a run id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE" > run.json
          python3 - "$GITHUB_SHA" "$GITHUB_REPOSITORY" <<'EOF'
          import json, sys
          run, sha, repo = json.load(open("run.json")), sys.argv[1], sys.argv[2]
          problems = [why for ok, why in [
              (run.get("path") == ".github/workflows/release.yml", f"run {run.get('id')} is {run.get('path')}"),
              (run.get("event") in ("push", "workflow_dispatch"), f"run event {run.get('event')}"),
              (run.get("head_sha") == sha, f"the candidate built {run.get('head_sha')}, the tag is {sha}"),
              ((run.get("head_repository") or {}).get("full_name") == repo, "the candidate ran in another repository"),
              (run.get("conclusion") == "success", f"the candidate run's conclusion is {run.get('conclusion')}"),
          ] if not ok]
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          EOF
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - run: python3 scripts/release_manifest.py verify rc --version "$V" --commit "$GITHUB_SHA"
        env:
          V: ${{ steps.check.outputs.version }}

  pypi:
    needs: authorize
    if: inputs.only == 'all' || inputs.only == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buddie/${{ needs.authorize.outputs.version }}/
    permissions:
      id-token: write
      actions: read
    env:
      V: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: the candidate's files, unchanged; the wheel and the sdist only
        run: |
          python3 scripts/release_manifest.py verify rc --version "$V" --commit "$GITHUB_SHA"
          mkdir upload && cp rc/dist/* upload/
      # skip-existing: a stage run again after a partial upload sends only what is missing; the check below then
      # refuses any file PyPI holds that is not the candidate's
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true
      - name: PyPI serves exactly the candidate's files
        run: |
          for i in $(seq 20); do
            curl -fsS "https://pypi.org/pypi/buddie/$V/json" -o pypi.json \
              && python3 scripts/release_manifest.py pypi rc pypi.json && exit 0
            sleep 15
          done
          exit 1

  mcp-registry:
    # the registry lists io.github.tsyyan/buddie (server.json) for a version PyPI already has: it checks the package's
    # README for the mcp-name line. GitHub OIDC proves the namespace, no secret needed
    needs: [authorize, pypi]
    if: >-
      always() && needs.authorize.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
      && (inputs.only == 'all' || inputs.only == 'mcp-registry')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      V: ${{ needs.authorize.outputs.version }}
      PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      SERVER: https://registry.modelcontextprotocol.io/v0/servers/io.github.tsyyan%2Fbuddie/versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: server.json is the version, and PyPI serves the candidate's files
        run: |
          sv=$(python3 -c "import json; d=json.load(open('server.json')); print(d['version'], d['packages'][0]['version'])")
          [ "$sv" = "$V $V" ] || { echo "::error::server.json is $sv"; exit 1; }
          curl -fsS "https://pypi.org/pypi/buddie/$V/json" -o pypi.json
          python3 scripts/release_manifest.py pypi rc pypi.json
      - name: publish, unless the registry already lists this version
        run: |
          code=$(curl -s -o listed.json -w '%{http_code}' "$SERVER/$V")
          if [ "$code" = 200 ]; then echo "::notice::the registry already lists $V"; exit 0; fi
          [ "$code" = 404 ] || { echo "::error::the registry answered $code"; exit 1; }
          curl -fsSL "$PUBLISHER" -o publisher.tar.gz
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: the registry lists it
        run: |
          for i in $(seq 10); do
            curl -fsS "$SERVER/$V" -o listed.json && grep -q "\"version\":\"$V\"" listed.json && exit 0
            sleep 10
          done
          exit 1

  github-release:
    # a draft first, the files uploaded and checked against the candidate, then published: a run that stops halfway
    # leaves a draft that the next run completes
    needs: [authorize, pypi]
    if: >-
      always() && needs.authorize.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
      && (inputs.only == 'all' || inputs.only == 'github-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.authorize.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: rc/
          run-id: ${{ inputs.candidate }}
          github-token: ${{ github.token }}
      - name: the candidate's files, unchanged, and on PyPI
        run: |
          python3 scripts/release_manifest.py verify rc --version "$V" --commit "$GITHUB_SHA"
          curl -fsS "https://pypi.org/pypi/buddie/$V/json" -o pypi.json
          python3 scripts/release_manifest.py pypi rc pypi.json
      - name: the release, with the changelog section and the candidate's files
        run: |
          release() { gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                        --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0] // empty" > release.json; }
          release
          if [ ! -s release.json ]; then
            awk -v v="$V" '$0 ~ "^## buddie " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "buddie $V" > notes.md
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "buddie $V" --notes-file notes.md
            release
          fi
          for name in $(python3 scripts/release_manifest.py github rc release.json); do
            gh release upload "$GITHUB_REF_NAME" "$(find rc -type f -name "$name")"
          done
          release
          missing=$(python3 scripts/release_manifest.py github rc release.json)
          [ -z "$missing" ] || { echo "::error::still missing: $missing"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false
