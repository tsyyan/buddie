name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  fast:
    # A stable, inexpensive pull-request signal. Full matrix and packaging run on merge_group/main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: security boundaries, verification and release authorization
        run: >-
          python -m pytest -q
          tests/test_core.py
          tests/test_security_hardening.py
          tests/test_release_authorization.py
          tests/test_workflow_pins.py
          tests/test_feedback.py
          tests/test_mcp_feedback.py
          tests/test_release_size_gate.py
  test:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pip install -e . pytest
      - run: pytest -q   # bare pytest, as a contributor runs it (python -m pytest would hide import shadowing)
      - name: quickstart example behaves as the README says
        working-directory: examples/quickstart
        run: |
          export VERBATIM_STORE=$RUNNER_TEMP/store
          buddie-verbatim add https://status.example.com/incidents/42 page.html
          set +e; buddie-verbatim check report.md --json $RUNNER_TEMP/v.json; code=$?; set -e
          test "$code" = 1
          python -c "import json,sys; v=[c['verdict'] for c in json.load(open(sys.argv[1]))['claims']]; assert v==['NOT_FOUND','FOUND','NOT_FOUND'], v" $RUNNER_TEMP/v.json
      - name: buddie examples behave as the README says
        run: |
          export VERBATIM_STORE=$RUNNER_TEMP/store2
          cd examples/quickstart
          buddie-verbatim add https://status.example.com/incidents/42 page.html
          set +e; buddie verify report.md --no-fetch --json $RUNNER_TEMP/r.json; code=$?; set -e
          test "$code" = 1
          python -c "import json,sys; p=json.load(open(sys.argv[1]))['predicate']; assert p['outcome']=='FAIL', p['outcome']" $RUNNER_TEMP/r.json
          cd ../work
          set +e; buddie verify report.md --transcript session.jsonl --no-github; code=$?; set -e
          test "$code" = 1
      - name: plugin runs from a clone without install
        run: python3 run.py verify examples/quickstart/report.md --no-fetch --anchors-only
  release-candidate:
    # Building artifacts on main would duplicate pre-merge validation; tag runs build the publishable candidate.
    if: github.event_name == 'merge_group'
    # what a release would publish (release-candidate.yml): sdist, wheel and the Claude Desktop bundle built from
    # this commit, twine check, wheel contents, the bundle validated, packed, unpacked and started, both packages
    # installed into clean venvs and run, the manifest and SHA256SUMS. Publishes nothing
    uses: ./.github/workflows/release-candidate.yml
  os:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    # the hook on Linux, macOS and Windows: tests from a clone (the smoke run on recorded events through hooks/run.sh
    # among them), then the same smoke run through a clean `pip install`
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q
        env:
          PYTHONUTF8: "1"   # the tests' fixtures are UTF-8; the hook itself does not need it (the smoke run below)
      - name: clean install, smoke run through the installed buddie
        run: |
          python -m pip install .
          buddie --version
          cd "$RUNNER_TEMP" && python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests/test_config.py" -k smoke -v
  catalogs:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    # what the catalogs read: the Claude Code plugin and marketplace (claude plugin validate), server.json against
    # the MCP Registry schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g --silent @anthropic-ai/claude-code
      - run: claude plugin validate --strict . && claude plugin validate --strict .claude-plugin/plugin.json
      - name: inventory the actual Directory source (including remaining review holds)
        run: python3 scripts/plugin_inventory.py --ref "$GITHUB_SHA" > "$RUNNER_TEMP/claude-directory-inventory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: claude-directory-inventory
          path: ${{ runner.temp }}/claude-directory-inventory.json
          if-no-files-found: error
      - run: |
          python3 -m pip install -q jsonschema
          curl -fsSL "$(python3 -c "import json; print(json.load(open('server.json'))['\$schema'])")" -o schema.json
          python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('server.json')), json.load(open('schema.json')))"
  docker:
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    # the remote MCP server as it is deployed (Dockerfile, docs/deploy.md): build, start, health, initialize, tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t buddie:ci .
      - name: the container answers MCP over HTTP
        run: |
          docker run -d --name buddie -p 8000:8000 buddie:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          rpc() { curl -fsS -X POST http://127.0.0.1:8000/mcp -H 'Content-Type: application/json' \
                    -H 'Accept: application/json, text/event-stream' -d "$1"; }
          rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | tee init.json
          rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > tools.json
          python3 -c "import json; t=[x['name'] for x in json.load(open('tools.json'))['result']['tools']]; assert sorted(t)==['snap','source_text','verify_report'], t"
          rpc '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"snap","arguments":{"urls":["http://169.254.169.254/latest/meta-data/"]}}}' > ssrf.json
          python3 -c "import json; r=json.load(open('ssrf.json'))['result']; e=r['structuredContent']['snapshots'][0]['error']; assert 'not a public address' in e, r"
      - if: always()
        run: docker logs buddie || true

  gate:
    # Stable status across PR, merge queue and main. Merge queue MUST be required by repository rules.
    name: gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fast, test, release-candidate, os, catalogs, docker]
    steps:
      - name: enforce results for this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          FAST: ${{ needs.fast.result }}
          TEST: ${{ needs.test.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
          OS: ${{ needs.os.result }}
          CATALOGS: ${{ needs.catalogs.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          test "$FAST" = success || { echo "::error::fast checks failed: $FAST"; exit 1; }
          if [ "$EVENT_NAME" = pull_request ]; then
            for result in "$TEST" "$RELEASE_CANDIDATE" "$OS" "$CATALOGS" "$DOCKER"; do
              test "$result" = skipped || { echo "::error::full job unexpectedly $result on PR"; exit 1; }
            done
          else
            for result in "$TEST" "$OS" "$CATALOGS" "$DOCKER"; do
              test "$result" = success || { echo "::error::required full job: $result"; exit 1; }
            done
            if [ "$EVENT_NAME" = merge_group ]; then
              test "$RELEASE_CANDIDATE" = success || { echo "::error::merge candidate check: $RELEASE_CANDIDATE"; exit 1; }
            else
              test "$RELEASE_CANDIDATE" = skipped || { echo "::error::unexpected candidate rebuild: $RELEASE_CANDIDATE"; exit 1; }
            fi
          fi
