name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y -q poppler-utils
      - run: pip install -e . pytest
      - run: pytest -q   # bare pytest, as a contributor runs it (python -m pytest would hide import shadowing)
      - name: quickstart example behaves as the README says
        working-directory: examples/quickstart
        run: |
          export VERBATIM_STORE=$RUNNER_TEMP/store
          verbatim add https://status.example.com/incidents/42 page.html
          set +e; verbatim check report.md --json $RUNNER_TEMP/v.json; code=$?; set -e
          test "$code" = 1
          python -c "import json,sys; v=[c['verdict'] for c in json.load(open(sys.argv[1]))['claims']]; assert v==['NOT_FOUND','FOUND','NOT_FOUND'], v" $RUNNER_TEMP/v.json
      - name: buddie examples behave as the README says
        run: |
          export VERBATIM_STORE=$RUNNER_TEMP/store2
          cd examples/quickstart
          verbatim add https://status.example.com/incidents/42 page.html
          set +e; buddie verify report.md --no-fetch --json $RUNNER_TEMP/r.json; code=$?; set -e
          test "$code" = 1
          python -c "import json,sys; p=json.load(open(sys.argv[1]))['predicate']; assert p['outcome']=='FAIL', p['outcome']" $RUNNER_TEMP/r.json
          cd ../work
          set +e; buddie verify report.md --transcript session.jsonl --no-github; code=$?; set -e
          test "$code" = 1
      - name: plugin runs from a clone without install
        run: python3 run.py verify examples/quickstart/report.md --no-fetch --anchors-only
  os:
    # the hook on Linux, macOS and Windows: tests from a clone (the smoke run on recorded events through hooks/run.sh
    # among them), then the same smoke run through a clean `pip install`
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q
        env:
          PYTHONUTF8: "1"   # the tests' fixtures are UTF-8; the hook itself does not need it (the smoke run below)
      - name: clean install, smoke run through the installed buddie
        run: |
          python -m pip install .
          buddie --version
          cd "$RUNNER_TEMP" && python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests/test_config.py" -k smoke -v
