name: ci
on:
  push:
    branches: [main]
  pull_request:
    # a ready (non-draft) PR gets full validation on every head; a draft gets fast checks only, unless labeled
    # full-ci-required. converted_to_draft / ready_for_review / (un)labeled re-run it, so the gate follows that state
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  # one live run per PR: an older run (e.g. full validation started before the label was removed) is cancelled
  # and can never finish after, and overwrite, the newer gate result
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast:
    # Inexpensive signal on every PR update. Full matrix and packaging run on main, on ready PRs and on drafts labeled
    # full-ci-required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: security boundaries, verification and release authorization
        run: >-
          python -m pytest -q
          tests/test_core.py
          tests/test_security_hardening.py
          tests/test_release_authorization.py
          tests/test_workflow_pins.py
          tests/test_feedback.py
          tests/test_mcp_feedback.py
          tests/test_release_size_gate.py
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci-required')))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pip install -e . pytest pytest-xdist
      # bare pytest, as a contributor runs it (python -m pytest would hide import shadowing); in parallel, except the
      # regex worker's timing-sensitive tests (parent death, budgets), which run alone after
      - run: pytest -q -n auto --ignore=tests/test_patterns_worker.py
      - run: pytest -q tests/test_patterns_worker.py
      - name: quickstart example behaves as the README says
        working-directory: examples/quickstart
        run: |
          export VERBATIM_STORE=$RUNNER_TEMP/store
          buddie-verbatim add https://status.example.com/incidents/42 page.html
          set +e; buddie-verbatim check report.md --json $RUNNER_TEMP/v.json; code=$?; set -e
          test "$code" = 1
          python -c "import json,sys; v=[c['verdict'] for c in json.load(open(sys.argv[1]))['claims']]; assert v==['NOT_FOUND','FOUND','NOT_FOUND'], v" $RUNNER_TEMP/v.json
      - name: buddie examples behave as the README says
        run: |
          export VERBATIM_STORE=$RUNNER_TEMP/store2
          cd examples/quickstart
          buddie-verbatim add https://status.example.com/incidents/42 page.html
          set +e; buddie verify report.md --no-fetch --json $RUNNER_TEMP/r.json; code=$?; set -e
          test "$code" = 1
          python -c "import json,sys; p=json.load(open(sys.argv[1]))['predicate']; assert p['outcome']=='FAIL', p['outcome']" $RUNNER_TEMP/r.json
          cd ../work
          set +e; buddie verify report.md --transcript session.jsonl --no-github; code=$?; set -e
          test "$code" = 1
      - name: plugin runs from a clone without install
        run: python3 run.py verify examples/quickstart/report.md --no-fetch --anchors-only
  release-candidate:
    # Built for the PR merge ref when full validation is requested. Not on main (it would duplicate the PR's
    # pre-merge build); release.yml builds the publishable candidate from the exact tag commit.
    if: github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci-required'))
    # what a release would publish (release-candidate.yml): sdist, wheel and the Claude Desktop bundle built from
    # this commit, twine check, wheel contents, the bundle validated, packed, unpacked and started, both packages
    # installed into clean venvs and run, the manifest and SHA256SUMS. Publishes nothing
    uses: ./.github/workflows/release-candidate.yml
  os:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci-required')))
    # the hook on Linux, macOS and Windows: tests from a clone (the smoke run on recorded events through hooks/run.sh
    # among them), then the same smoke run through a clean `pip install`
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install pytest pytest-xdist
      - run: python -m pytest -q -n auto --ignore=tests/test_patterns_worker.py
        env:
          PYTHONUTF8: "1"   # the tests' fixtures are UTF-8; the hook itself does not need it (the smoke run below)
      - run: python -m pytest -q tests/test_patterns_worker.py   # timing-sensitive: alone
        env:
          PYTHONUTF8: "1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: verify built archives and clean wheel/sdist installs
        run: |
          v=$(python -c "import buddie; print(buddie.__version__)")
          python scripts/release_notes.py --version "$v" --out "$RUNNER_TEMP/public-metadata"
          cmp packaging/README.md "$RUNNER_TEMP/public-metadata/pypi-readme.md"
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/runtime-dist"
          python scripts/check_runtime_archive.py "$RUNNER_TEMP"/runtime-dist/*
          python scripts/check_public_packages.py --version "$v" --record "releases/$v.json" "$RUNNER_TEMP"/runtime-dist/*
          python scripts/check_clean_archives.py "$RUNNER_TEMP/runtime-dist"
      - name: verify and smoke MCPB and compact plugin on this OS
        run: |
          cp "$RUNNER_TEMP/public-metadata/desktop-readme.md" README.md
          cp "$RUNNER_TEMP/public-metadata/release-notes.md" RELEASE_NOTES.md
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . "$RUNNER_TEMP/buddie.mcpb"
          python scripts/check_runtime_archive.py "$RUNNER_TEMP/buddie.mcpb"
          npx --yes @anthropic-ai/mcpb@2.1.2 unpack "$RUNNER_TEMP/buddie.mcpb" "$RUNNER_TEMP/runtime-bundle"
          python scripts/smoke_mcpb.py "$RUNNER_TEMP/runtime-bundle"
          python scripts/plugin_package.py build --ref "$GITHUB_SHA" --out "$RUNNER_TEMP/runtime-plugin" --tree "$RUNNER_TEMP/runtime-plugin-tree"
          python scripts/check_runtime_archive.py "$RUNNER_TEMP"/runtime-plugin/*.zip
          python scripts/smoke_plugin.py "$RUNNER_TEMP/runtime-plugin-tree" --manifest "$RUNNER_TEMP/runtime-plugin/plugin-manifest.json"
      - name: clean install, smoke run through the installed buddie
        run: |
          python -m pip install .
          buddie --version
          cd "$RUNNER_TEMP" && python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests/test_config.py" -k smoke -v
  catalogs:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci-required')))
    # what the catalogs read: the Claude Code plugin and marketplace (claude plugin validate), server.json against
    # the MCP Registry schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g --silent @anthropic-ai/claude-code
      - run: claude plugin validate --strict . && claude plugin validate --strict .claude-plugin/plugin.json
      - name: inventory the actual Directory source (including remaining review holds)
        run: python3 scripts/plugin_inventory.py --ref "$GITHUB_SHA" > "$RUNNER_TEMP/claude-directory-inventory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: claude-directory-inventory
          path: ${{ runner.temp }}/claude-directory-inventory.json
          if-no-files-found: error
      - run: |
          python3 -m pip install -q jsonschema
          curl -fsSL "$(python3 -c "import json; print(json.load(open('server.json'))['\$schema'])")" -o schema.json
          python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('server.json')), json.load(open('schema.json')))"
  docker:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci-required')))
    # the remote MCP server as it is deployed (Dockerfile, docs/deploy.md): build, start, health, initialize, tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t buddie:ci .
      - name: the container answers MCP over HTTP
        run: |
          docker run -d --name buddie -p 8000:8000 buddie:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          rpc() { curl -fsS -X POST http://127.0.0.1:8000/mcp -H 'Content-Type: application/json' \
                    -H 'Accept: application/json, text/event-stream' -d "$1"; }
          rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | tee init.json
          rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > tools.json
          python3 -c "import json; t=[x['name'] for x in json.load(open('tools.json'))['result']['tools']]; assert sorted(t)==['snap','source_text','verify_report'], t"
          rpc '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"snap","arguments":{"urls":["http://169.254.169.254/latest/meta-data/"]}}}' > ssrf.json
          python3 -c "import json; r=json.load(open('ssrf.json'))['result']; e=r['structuredContent']['snapshots'][0]['error']; assert 'not a public address' in e, r"
      - if: always()
        run: docker logs buddie || true
      - name: the release image (packaging/docker/Dockerfile) from a wheel of this commit answers MCP over stdio
        run: |
          v=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('buddie/__init__.py').read())[1])")
          mkdir -p ctx/dist && pip wheel -q --no-deps -w ctx/dist .
          docker build -f packaging/docker/Dockerfile --build-arg VERSION="$v" -t buddie:release ctx
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | docker run -i --rm buddie:release > out.jsonl
          python3 -c "import json; r=[json.loads(l) for l in open('out.jsonl') if l.strip()]; t={x['name'] for x in r[-1]['result']['tools']}; assert {'verify_report','snap','source_text'} <= t, t; print(sorted(t))"
          test "$(docker run --rm buddie:release --version)" = "buddie $v"

  dist:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci-required')))
    # the multi-client package (scripts/dist_package.py) installed in each client, isolated homes, no credentials:
    # Claude Code validates, installs and runs its Stop hook; Codex and Copilot install it from their marketplaces;
    # Gemini installs the extension and connects to its MCP server
    runs-on: ubuntu-latest
    env:
      CLAUDE_CLI: "@anthropic-ai/claude-code@2.1.310"
      CODEX_CLI: "@openai/codex@0.166.0"
      GEMINI_CLI: "@google/gemini-cli@0.66.0"
      COPILOT_CLI: "@github/copilot@1.0.105"
    steps:
      - uses: actions/checkout@v4
      - name: build the package tree
        run: python3 scripts/dist_package.py tree --ref HEAD "$RUNNER_TEMP/dist"
      - name: Claude Code
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"; mkdir -p "$CLAUDE_CONFIG_DIR"
          npx --yes "$CLAUDE_CLI" plugin validate --strict "$RUNNER_TEMP/dist"
          npx --yes "$CLAUDE_CLI" plugin marketplace add "$RUNNER_TEMP/dist"
          npx --yes "$CLAUDE_CLI" plugin install buddie@buddie
          root=$(python3 -c "import json,os; d=json.load(open(os.path.join(os.environ['CLAUDE_CONFIG_DIR'],'plugins','installed_plugins.json'))); print(d['plugins']['buddie@buddie'][0]['installPath'])")
          set +e
          printf '%s' '{"hook_event_name":"Stop","stop_hook_active":false,"cwd":"/tmp","last_assistant_message":"CI failed ⚓ `ci:tsyyan/buddie@169da519a6f4=failure`."}' \
            | CLAUDE_PLUGIN_ROOT="$root" sh "$root/hooks/run.sh" hook 2> hook.err; code=$?
          set -e
          cat hook.err
          test "$code" = 2 && grep -q "checks are success" hook.err
      - name: Codex
        run: |
          export CODEX_HOME="$HOME/.codex-ci"; mkdir -p "$CODEX_HOME"
          npx --yes "$CODEX_CLI" plugin marketplace add "$RUNNER_TEMP/dist"
          npx --yes "$CODEX_CLI" plugin add buddie@buddie
          test -f "$CODEX_HOME/plugins/cache/buddie/buddie/$(python3 -c 'import buddie; print(buddie.__version__)')/hooks/codex.json"
      - name: Gemini CLI
        run: |
          export HOME="$RUNNER_TEMP/gemini-home"; mkdir -p "$HOME"
          npm install -g "$GEMINI_CLI" --silent
          echo y | gemini extensions install "$RUNNER_TEMP/dist" --consent --skip-settings
          gemini mcp list < /dev/null | tee mcp.txt
          grep -q "buddie.*Connected" mcp.txt
      - name: Copilot CLI
        run: |
          export HOME="$RUNNER_TEMP/copilot-home"; mkdir -p "$HOME"
          npm install -g "$COPILOT_CLI" --silent
          copilot plugin marketplace add "$RUNNER_TEMP/dist" < /dev/null
          copilot plugin install buddie@buddie < /dev/null | tee cop.txt
          grep -q "installed successfully" cop.txt

  gate:
    # The one required status check. Fail-closed: on a pull request it passes only when full validation ran (the PR
    # is ready, or a draft labeled full-ci-required) and every full job, the release candidate included,
    # succeeded for this run's commit. Fast checks alone never make it pass.
    name: gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fast, test, release-candidate, os, catalogs, docker, dist]
    steps:
      - name: enforce results for this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REQUESTED: ${{ github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci-required')) }}
          FAST: ${{ needs.fast.result }}
          TEST: ${{ needs.test.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
          OS: ${{ needs.os.result }}
          CATALOGS: ${{ needs.catalogs.result }}
          DOCKER: ${{ needs.docker.result }}
          DIST: ${{ needs.dist.result }}
        run: |
          test "$FAST" = success || { echo "::error::fast checks: $FAST"; exit 1; }
          case "$EVENT_NAME" in
            pull_request)
              if [ "$FULL_REQUESTED" != true ]; then
                echo "::error::draft PR: mark it ready for review (or label it full-ci-required) for full validation"; exit 1
              fi
              for result in "$TEST" "$RELEASE_CANDIDATE" "$OS" "$CATALOGS" "$DOCKER" "$DIST"; do
                test "$result" = success || { echo "::error::required full job: $result"; exit 1; }
              done ;;
            push)
              for result in "$TEST" "$OS" "$CATALOGS" "$DOCKER" "$DIST"; do
                test "$result" = success || { echo "::error::required full job: $result"; exit 1; }
              done
              test "$RELEASE_CANDIDATE" = skipped || { echo "::error::unexpected candidate rebuild: $RELEASE_CANDIDATE"; exit 1; } ;;
            *) echo "::error::unsupported event $EVENT_NAME"; exit 1 ;;
          esac
