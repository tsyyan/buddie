name: BDX-004 model-free starter set
on:
  push:
    branches: [experiment/bdx-004-run]
  pull_request:
    paths:
      - 'experiments/BDX-004-command-fit/**'
      - '.github/workflows/bdx004.yml'
permissions:
  contents: read
jobs:
  model-free:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, as BDX-003
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, as BDX-003
        with:
          python-version: '3.12'
      - name: Model-free tests (stdlib only, no installation or model credentials)
        run: python -m unittest discover -s experiments/BDX-004-command-fit/tests -v
      - name: Validate every profile against the real diagnostics checker
        run: python -c "import json,pathlib; from buddie.diagnostics import problems; fs=[p for p in pathlib.Path('experiments/BDX-004-command-fit/profiles').glob('*.json') if p.stem!='index']; assert len(fs)>=8; errors={p.name:problems(json.loads(p.read_text(encoding='utf-8'))) for p in fs}; assert not any(errors.values()), errors; print(len(fs), 'profiles valid')"
  run:
    # a push to experiment/bdx-004-run runs what run.env says: the judge-validation pilot or the experiment.
    # Results are notices (summarize.py) and an artifact with the rows and the sheet of judged commands (model
    # answers and their commands only; profiles are synthetic)
    if: github.ref == 'refs/heads/experiment/bdx-004-run'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, as BDX-003
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, as BDX-003
        with:
          python-version: '3.12'
      - name: model-free tests
        run: python -m unittest discover -s experiments/BDX-004-command-fit/tests
      - name: settings (run.env)
        run: grep -E '^[A-Z_]+=' experiments/BDX-004-command-fit/run.env >> "$GITHUB_ENV"
      - name: earlier chunks of this run (resumable)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0, as BDX-003
        with:
          path: experiments/BDX-004-command-fit/data
          key: bdx004-${{ env.OUT }}-${{ github.run_id }}
          restore-keys: bdx004-${{ env.OUT }}-
      - name: arms
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd experiments/BDX-004-command-fit
          timeout --signal=INT "${MINUTES}m" python run.py --arms "$ARMS" --provider "$PROVIDER" --model "$MODEL" \
            ${PILOT:+--pilot "$PILOT"} ${N:+--n "$N"} ${SEED:+--seed "$SEED"} \
            ${EXCLUDE_PILOT_SEED:+--exclude-pilot-seed "$EXCLUDE_PILOT_SEED"} ${REDO_ERRORS:+--redo-errors} \
            --out "data/$OUT" || echo "run.py ended with $?"
      - name: summary
        if: always()
        run: |
          cd experiments/BDX-004-command-fit
          test -s "data/$OUT" || exit 0
          python summarize.py "data/$OUT" --sheet "data/${OUT%.jsonl}-commands.csv" --examples 8
      - name: whole answers (10, with a WONT_RUN or UNKNOWN command)
        if: always()
        run: |
          cd experiments/BDX-004-command-fit
          test -s "data/$OUT" || exit 0
          python summarize.py "data/$OUT" --dump 10
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0, as BDX-003
        if: always()
        with:
          path: experiments/BDX-004-command-fit/data
          key: bdx004-${{ env.OUT }}-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2, as BDX-003
        if: always()
        with:
          name: bdx004-${{ github.run_id }}
          path: experiments/BDX-004-command-fit/data/
          if-no-files-found: warn

