name: BDX-004 model-free starter set
on:
  pull_request:
    paths:
      - 'experiments/BDX-004-command-fit/**'
      - '.github/workflows/bdx004.yml'
permissions:
  contents: read
jobs:
  model-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, as BDX-003
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, as BDX-003
        with:
          python-version: '3.12'
      - name: Model-free tests (stdlib only, no installation or model credentials)
        run: python -m unittest discover -s experiments/BDX-004-command-fit/tests -v
      - name: Validate every profile against the real diagnostics checker
        run: python -c "import json,pathlib; from buddie.diagnostics import problems; fs=[p for p in pathlib.Path('experiments/BDX-004-command-fit/profiles').glob('*.json') if p.stem!='index']; assert len(fs)>=8; errors={p.name:problems(json.loads(p.read_text(encoding='utf-8'))) for p in fs}; assert not any(errors.values()), errors; print(len(fs), 'profiles valid')"
