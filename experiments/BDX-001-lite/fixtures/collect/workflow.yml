# BDX-001 Lite fixture collection: genuine Linux recordings on GitHub-hosted runners.
# This file was run once from a temporary branch (bdx-001-lite-collect) as .github/workflows/bdx-collect.yml;
# it is kept here so the collection can be repeated. It is not part of buddie's CI.
name: bdx-001-collect
on:
  push:
    branches: [bdx-001-lite-collect]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {env: linux-x64, runner: ubuntu-24.04, alias: srv-bravo}
          - {env: linux-arm64, runner: ubuntu-24.04-arm, alias: arm-charlie}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: >
          /usr/bin/python3 experiments/BDX-001-lite/fixtures/collect/collect.py --env-id ${{ matrix.env }}
          --host-alias ${{ matrix.alias }} --out out/${{ matrix.env }}
          --note "GitHub-hosted ${{ matrix.runner }} runner, native, system python3, no setup actions"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: {name: "${{ matrix.env }}", path: "out/${{ matrix.env }}"}
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: linux-container-2g
            alias: box-delta
            image: python:3.12-slim
            docker_args: --memory=2g --memory-swap=2g --cpus=2
            prep: "true"
            py: python3
            note: "python:3.12-slim container on an ubuntu-24.04 runner, --memory=2g --memory-swap=2g --cpus=2"
          - env: debian-nopython
            alias: box-echo
            image: debian:bookworm-slim
            docker_args: ""
            prep: "apt-get update -q && apt-get install -y -q --no-install-recommends python3 >/dev/null"
            py: /usr/bin/python3
            note: "debian:bookworm-slim container with apt-get install python3 only (no python-is-python3, pip, venv)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: >
          docker run --rm ${{ matrix.docker_args }} -v "$PWD:/w" -w /w ${{ matrix.image }} bash -c
          '${{ matrix.prep }} && ${{ matrix.py }} experiments/BDX-001-lite/fixtures/collect/collect.py
          --env-id ${{ matrix.env }} --host-alias ${{ matrix.alias }} --out out/${{ matrix.env }}
          --note "${{ matrix.note }}"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: {name: "${{ matrix.env }}", path: "out/${{ matrix.env }}"}
