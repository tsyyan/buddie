[project]
name = "buddie"
version = "0.8.2"
description = "Receipts for agent work: check what an AI agent reports (quotes, repo state, PR and CI status, command output) against primary evidence, without a model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["ai-agents", "multi-agent", "oversight", "faithfulness", "citation-verification", "claude-code", "mcp"]
dependencies = []

[project.urls]
Repository = "https://github.com/tsyyan/buddie"

[project.optional-dependencies]
browser = ["playwright"]  # verbatim --access browser: render JavaScript pages (verbatim/access.py)

[project.scripts]
buddie = "buddie.cli:main"
verbatim = "verbatim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["buddie", "verbatim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
